<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор Robux</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #3b3b3b, #505050);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: #eee;
  }

  .calculator {
    background: #4a4a4acc;
    backdrop-filter: blur(10px);
    padding: 35px 40px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    width: 480px;
    text-align: center;
    transition: transform 0.3s;
  }
  .calculator:hover { transform: translateY(-5px); }

  h2 { margin-bottom: 25px; color: #f0f0f0; font-size: 24px; }

  .input-group { margin: 18px 0; text-align: left; }
  label { display: block; margin-bottom: 6px; font-weight: 600; color: #ccc; }

  input[type="number"] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #666; background: #5a5a5a; color: #eee;
    font-size: 16px; outline: none; transition: all 0.3s;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
  }
  input[type="number"]:focus { border-color: #74ebd5; box-shadow: 0 0 10px rgba(116,235,213,0.5); }

  .btn-calc, .btn-copy {
    margin-top: 15px; padding: 12px 25px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer; color: #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: all 0.3s;
  }
  .btn-calc { background: linear-gradient(90deg, #3a9c9c, #2d7d7d); }
  .btn-calc:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
  .btn-copy { background: linear-gradient(90deg, #f6a11b, #d36b0b); margin-left: 10px; }
  .btn-copy:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }

  .exchange-rate { margin-top: 10px; font-size: 14px; color: #ccc; display: flex; align-items: center; justify-content: center; }
  .exchange-rate span { margin-left: 5px; font-weight: 600; }

  .result {
    margin-top: 25px; font-size: 18px; font-weight: 600; padding: 15px;
    border-radius: 12px; background: #5a5a5a; color: #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: all 0.3s;
  }

  .per-person-section, .forecast-section { margin-top: 15px; text-align: left; }
  .per-person-section h3, .forecast-section h3 { margin-bottom: 8px; color: #ccc; font-size: 16px; }
  .per-person, .forecast {
    font-size: 16px; font-weight: 500; padding: 12px; border-radius: 12px;
    background: #606060; color: #fff; box-shadow: 0 5px 12px rgba(0,0,0,0.3);
  }
  .per-person div, .forecast div { margin: 4px 0; }

  /* Минималистичный слайдер без кружка */
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: #606060;
    outline: none;
    margin-top: 6px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 0;
    height: 0;
  }
  input[type="range"]::-moz-range-thumb {
    width: 0;
    height: 0;
    border: none;
  }

  .slider-value {
    font-weight: 600;
    color: #f6a11b;
    float: right;
  }
</style>
</head>
<body>
<div class="calculator">
  <h2>Калькулятор Robux → $ / ₽</h2>

  <div class="input-group">
    <label>Количество Robux:</label>
    <input type="number" id="robux" value="0">
  </div>

  <div class="input-group">
    <label>Курс Robux → $:</label>
    <input type="number" id="rateDollar" value="0.0038" step="0.0001">
  </div>

  <div class="input-group">
    <label>На сколько человек делить: <span id="peopleValue" class="slider-value">3</span></label>
    <input type="range" id="numPeople" min="1" max="10" value="3">
  </div>

  <div class="input-group">
    <label>Доход за 72 часа (Robux):</label>
    <input type="number" id="robux72h" value="0">
  </div>

  <div class="input-group">
    <label>Выберите количество месяцев: <span id="monthsValue" class="slider-value">1</span></label>
    <input type="range" id="months" min="1" max="12" value="1">
  </div>

  <div class="exchange-rate">
    Курс USD → ₽: <span id="exchangeRateIndicator">загрузка...</span>
  </div>

  <button class="btn-calc" id="calculateBtn">Рассчитать</button>
  <button class="btn-copy" id="copyBtn">Скопировать</button>

  <div class="result" id="result">Итого: 💵0 $ | ₽0 ₽</div>

  <div class="per-person-section">
    <h3>На человека:</h3>
    <div class="per-person" id="perPerson">
      <div>💎 Robux: 0</div>
      <div>💵 $: 0</div>
      <div>₽: 0</div>
    </div>
  </div>

  <div class="forecast-section">
    <h3>Прогноз дохода:</h3>
    <div class="forecast" id="incomeForecast">
      <div>За выбранный период: 💎0 | 💵0 $ | ₽0 ₽</div>
      <div>На человека: 💎0 | 💵0 $ | ₽0 ₽</div>
    </div>
  </div>
</div>

<script>
function formatNumber(num) {
  return num.toLocaleString('ru-RU', {maximumFractionDigits: 2});
}

let usdToRubValue = 100;

async function fetchExchangeRate() {
  try {
    const response = await fetch('https://v6.exchangerate-api.com/v6/71cc0a8e9363cf9336cdf753/latest/USD');
    const data = await response.json();
    usdToRubValue = data.conversion_rates.RUB;
    document.getElementById('exchangeRateIndicator').textContent = formatNumber(usdToRubValue);
  } catch {
    document.getElementById('exchangeRateIndicator').textContent = formatNumber(usdToRubValue);
  }
}
fetchExchangeRate();

function updateSliderFill(slider) {
  const value = slider.value;
  const min = slider.min ? slider.min : 0;
  const max = slider.max ? slider.max : 100;
  const percentage = ((value - min) / (max - min)) * 100;
  slider.style.background = `linear-gradient(to right, #f6a11b 0%, #f6a11b ${percentage}%, #606060 ${percentage}%, #606060 100%)`;
}

const monthsSlider = document.getElementById('months');
const monthsValue = document.getElementById('monthsValue');
monthsSlider.addEventListener('input', () => {
  monthsValue.textContent = monthsSlider.value;
  updateSliderFill(monthsSlider);
  calculate();
});
updateSliderFill(monthsSlider);

const peopleSlider = document.getElementById('numPeople');
const peopleValue = document.getElementById('peopleValue');
peopleSlider.addEventListener('input', () => {
  peopleValue.textContent = peopleSlider.value;
  updateSliderFill(peopleSlider);
  calculate();
});
updateSliderFill(peopleSlider);

function calculate() {
  const robux = parseFloat(document.getElementById('robux').value) || 0;
  const rateDollar = parseFloat(document.getElementById('rateDollar').value) || 0;
  const numPeople = parseInt(document.getElementById('numPeople').value) || 1;
  const robux72h = parseFloat(document.getElementById('robux72h').value) || 0;
  const months = parseInt(document.getElementById('months').value) || 1;

  const dollars = robux * rateDollar;
  const rubles = dollars * usdToRubValue;
  document.getElementById('result').textContent = `💵${formatNumber(dollars)} $ | ₽${formatNumber(rubles)} ₽`;

  const robuxPerPerson = robux / numPeople;
  const dollarsPerPerson = dollars / numPeople;
  const rublesPerPerson = rubles / numPeople;
  document.getElementById('perPerson').innerHTML = `
    <div>💎 Robux: ${formatNumber(robuxPerPerson)}</div>
    <div>💵 $: ${formatNumber(dollarsPerPerson)}</div>
    <div>₽: ${formatNumber(rublesPerPerson)}</div>
  `;

  const robuxPerDay = robux72h / 3;
  const robuxForecast = robuxPerDay * 30 * months;
  const usdForecast = robuxForecast * rateDollar;
  const rubForecast = usdForecast * usdToRubValue;

  const robuxForecastPerPerson = robuxForecast / numPeople;
  const usdForecastPerPerson = usdForecast / numPeople;
  const rubForecastPerPerson = rubForecast / numPeople;

  document.getElementById('incomeForecast').innerHTML = `
    <div>За ${months} месяц(ев): 💎${formatNumber(robuxForecast)} | 💵${formatNumber(usdForecast)} $ | ₽${formatNumber(rubForecast)} ₽</div>
    <div>На человека: 💎${formatNumber(robuxForecastPerPerson)} | 💵${formatNumber(usdForecastPerPerson)} $ | ₽${formatNumber(rubForecastPerPerson)} ₽</div>
  `;
}

document.getElementById('calculateBtn').addEventListener('click', calculate);

document.getElementById('copyBtn').addEventListener('click', () => {
  let text = document.getElementById('result').textContent + '\n\nНа человека:\n' +
    Array.from(document.getElementById('perPerson').children).map(d => d.textContent).join('\n') +
    '\n\nПрогноз дохода:\n' +
    Array.from(document.getElementById('incomeForecast').children).map(d => d.textContent).join('\n');
  navigator.clipboard.writeText(text);
  alert('Результаты скопированы!');
});

calculate();
</script>
</body>
</html>
